{% include 'header.html' %}

<div class="row">
    <div class="col-lg-6 mx-auto">
        <h3>Open a Log File</h3>
        <form enctype="multipart/form-data" id="upload-form" data-max-size="{{ max_upload_size }}">
            <div class="mb-3">
                <label for="description" class="form-label">Description (optional)</label>
                <input class="form-control" name="description" id="description" type="text">
            </div>
            <div class="mb-3">
                <label for="file" class="form-label">ULog File (up to 1 GB)</label>
                <input type="file" name="filearg" id="file" class="form-control" accept=".ulg,.ulge" required>
            </div>
            <input type="hidden" name="redirect" value="false">
            <button class="btn btn-primary" id="upload-button" type="submit">Open Log</button>
            <div class="progress mt-3" style="height: 20px; display: none;">
                <div class="progress-bar progress-bar-striped" role="progressbar" style="width: 0%;"
                     aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
            </div>
            <div id="upload-status" class="mt-2" role="status" aria-live="polite"></div>
            <div id="upload-failure" class="alert alert-danger mt-3" role="alert" style="display: none;"></div>
        </form>
    </div>
</div>

{% include 'footer.html' %}
<script src="plot_app/static/js/upload.js"></script>
</body>
</html>
